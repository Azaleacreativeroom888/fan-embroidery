<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ギャラリー | はりしごと</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#bfe6f7;
  --sky-deep:#5bb4e0;
  --sky-pale:#eaf7fd;
  --sun:#ffd23f;
  --sun-pale:#fff3b8;
  --ink:#1d3b52;
  --white:#fff;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  background:var(--sky-pale);
  color:var(--ink);
  line-height:1.85;
  font-size:16px;
}
a{color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:4px}

.stitch{border:2px dashed var(--sky-deep);border-radius:18px}

header{
  background:var(--sky);
  border-bottom:4px solid var(--sun);
  position:sticky;top:0;z-index:10;
}
.bar{
  max-width:1000px;margin:0 auto;padding:12px 20px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
}
.logo{font-weight:700;font-size:1.25rem;text-decoration:none;letter-spacing:.08em}
nav ul{list-style:none;display:flex;gap:6px;flex-wrap:wrap}
nav a{
  display:block;padding:6px 16px;border-radius:999px;text-decoration:none;font-weight:500;
  transition:background .2s;
}
nav a:hover{background:var(--sun-pale)}
nav a[aria-current="page"]{background:var(--sun)}

main{max-width:1000px;margin:0 auto;padding:0 20px}

.title{padding:48px 0 20px}
.title h1{font-size:clamp(1.8rem,4.6vw,2.6rem);line-height:1.35;margin-bottom:8px}
.title h1 span{background:linear-gradient(transparent 62%,var(--sun) 62%);padding:0 4px}
.title p{opacity:.85}

/* 絞り込みボタン */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 26px}
.filters button{
  font:inherit;font-weight:700;color:var(--ink);cursor:pointer;
  padding:7px 20px;border-radius:999px;background:var(--white);
  border:2px solid var(--ink);transition:transform .15s,background .2s;
}
.filters button:hover{transform:translateY(-2px)}
.filters button[aria-pressed="true"]{background:var(--sun)}

/* 作品グリッド */
.grid{
  display:grid;gap:20px;list-style:none;
  grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
  padding-bottom:20px;
}
.grid li[hidden]{display:none}
.work{background:var(--white);padding:12px 12px 14px;height:100%}
/* 画像の枠：縦長の漫画ページも入る 3:4 */
.frame{
  aspect-ratio:3/4;border-radius:10px;overflow:hidden;
  display:grid;place-items:center;text-align:center;
  background:var(--sun-pale);font-size:.85rem;padding:10px;
}
.frame img{width:100%;height:100%;object-fit:cover;display:block}
li:nth-child(even) .frame{background:var(--sky)}
.work h2{font-size:1rem;margin-top:10px;line-height:1.5}
.work .tag{
  display:inline-block;margin-top:4px;padding:0 10px;border-radius:999px;
  background:var(--sun);font-size:.75rem;font-weight:700;
}

footer{
  margin-top:40px;padding:26px 20px;text-align:center;
  background:var(--sky);border-top:4px solid var(--sun);font-size:.9rem;
}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .filters button{transition:none}
}
</style>
</head>
<body>

<header>
  <div class="bar">
    <a class="logo" href="index.html">はりしごと</a>
    <nav aria-label="メインメニュー">
      <ul>
        <li><a href="index.html">ホーム</a></li>
        <li><a href="blog.html">ブログ</a></li>
        <li><a href="gallery.html" aria-current="page">ギャラリー</a></li>
        <li><a href="about.html">about</a></li>
      </ul>
    </nav>
  </div>
</header>

<main>
  <div class="title">
    <h1><span>ギャラリー</span></h1>
    <p>漫画やイラスト、刺繍の作品を並べています。</p>
  </div>

  <div class="filters" role="group" aria-label="作品の種類で絞り込み">
    <button type="button" data-filter="all" aria-pressed="true">すべて</button>
    <button type="button" data-filter="illust" aria-pressed="false">イラスト</button>
    <button type="button" data-filter="manga" aria-pressed="false">漫画</button>
    <button type="button" data-filter="embroidery" aria-pressed="false">刺繍</button>
  </div>

  <!--
    作品の追加方法：
    <li> ... </li> を丸ごとコピーして貼り、次の3か所を書き換えてください。
      1. data-type … illust / manga / embroidery のどれか
      2. <div class="frame"> の中身 … <img src="画像のファイル名" alt="作品の説明"> に置き換える
      3. 題名とタグの文字
  -->
  <ul class="grid">
    <li data-type="illust">
      <figure class="work stitch">
        <div class="frame">イラスト<br>（画像を入れてね）</div>
        <figcaption>
          <h2>作品のタイトル</h2>
          <span class="tag">イラスト</span>
        </figcaption>
      </figure>
    </li>
    <li data-type="manga">
      <figure class="work stitch">
        <div class="frame">漫画<br>（画像を入れてね）</div>
        <figcaption>
          <h2>作品のタイトル</h2>
          <span class="tag">漫画</span>
        </figcaption>
      </figure>
    </li>
    <li data-type="embroidery">
      <figure class="work stitch">
        <div class="frame">刺繍<br>（画像を入れてね）</div>
        <figcaption>
          <h2>作品のタイトル</h2>
          <span class="tag">刺繍</span>
        </figcaption>
      </figure>
    </li>
    <li data-type="illust">
      <figure class="work stitch">
        <div class="frame">イラスト<br>（画像を入れてね）</div>
        <figcaption>
          <h2>作品のタイトル</h2>
          <span class="tag">イラスト</span>
        </figcaption>
      </figure>
    </li>
    <li data-type="manga">
      <figure class="work stitch">
        <div class="frame">漫画<br>（画像を入れてね）</div>
        <figcaption>
          <h2>作品のタイトル</h2>
          <span class="tag">漫画</span>
        </figcaption>
      </figure>
    </li>
    <li data-type="embroidery">
      <figure class="work stitch">
        <div class="frame">刺繍<br>（画像を入れてね）</div>
        <figcaption>
          <h2>作品のタイトル</h2>
          <span class="tag">刺繍</span>
        </figcaption>
      </figure>
    </li>
  </ul>
</main>

<footer>
  <p>© 2026 はりしごと</p>
</footer>

<script>
(function(){
  var buttons = document.querySelectorAll('.filters button');
  var items = document.querySelectorAll('.grid li');
  buttons.forEach(function(btn){
    btn.addEventListener('click', function(){
      var f = btn.getAttribute('data-filter');
      buttons.forEach(function(b){ b.setAttribute('aria-pressed', b === btn ? 'true' : 'false'); });
      items.forEach(function(li){
        li.hidden = !(f === 'all' || li.getAttribute('data-type') === f);
      });
    });
  });
})();
</script>

</body>
</html>
